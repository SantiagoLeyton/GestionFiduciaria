<header class="topbar">
  <div class="search-placeholder">Buscar proyectos, clientes, unidades...</div>
  <div class="user-menu">
    <div class="user-name">
      <strong>{{ request.user.full_name }}</strong>
      <span>{{ request.user.get_role_display }}</span>
    </div>
    <form method="post" action="{% url 'logout' %}">
      {% csrf_token %}
      <button class="btn btn-outline-secondary btn-sm" type="submit">Cerrar sesion</button>
    </form>
  </div>
</header>
