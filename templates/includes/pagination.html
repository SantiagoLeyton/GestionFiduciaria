{% if is_paginated %}
  <nav class="pagination-bar" aria-label="Paginacion">
    {% if page_obj.has_previous %}
      <a class="btn btn-outline-secondary btn-sm" href="?{% if page_querystring %}{{ page_querystring }}&{% endif %}page={{ page_obj.previous_page_number }}">Anterior</a>
    {% else %}
      <span class="btn btn-outline-secondary btn-sm disabled">Anterior</span>
    {% endif %}
    <span>Pagina {{ page_obj.number }} de {{ page_obj.paginator.num_pages }}</span>
    {% if page_obj.has_next %}
      <a class="btn btn-outline-secondary btn-sm" href="?{% if page_querystring %}{{ page_querystring }}&{% endif %}page={{ page_obj.next_page_number }}">Siguiente</a>
    {% else %}
      <span class="btn btn-outline-secondary btn-sm disabled">Siguiente</span>
    {% endif %}
  </nav>
{% endif %}
